receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 512
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert

exporters:
  # Traces + Logs → Elasticsearch（默认 otel 模式：自动建 index template + data stream，
  # 如 traces-apm-default / logs-generic.default，exporter 全自动管理，无需手动建索引）
  elasticsearch/traces:
    endpoints: ["http://elasticsearch:9200"]
  # Debug
  debug:
    verbosity: basic
  # Metrics → Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    # 把 resource 属性转为 Prometheus 标签：service.name → service_name（面板按服务过滤需要）
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [elasticsearch/traces, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [elasticsearch/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
