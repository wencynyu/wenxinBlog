global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # =====================================================
  # OTel Collector 的 Prometheus exporter（:8889）
  # -----------------------------------------------------
  # 所有服务（Java agent Micrometer 桥 / Go otelfiber / Python OTel）
  # 的指标统一经 OTLP → Collector → 这里暴露。用 service_name 标签区分服务。
  # 不再逐服务抓 /actuator/prometheus 或 /metrics。
  # =====================================================
  - job_name: 'otel-collector'
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']
