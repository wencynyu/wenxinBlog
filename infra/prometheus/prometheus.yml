global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # blog-service（博文 CRUD + Kafka 事件）
  - job_name: 'blog-service'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8003']
        labels:
          service: 'blog-service'

  # recommendation-service（推荐 + Milvus + embedding）
  - job_name: 'recommendation-service'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8006']
        labels:
          service: 'recommendation-service'

  # gateway management 端口 8081（独立于路由端口 8080）
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'gateway'

  # experiment-service（A/B 测试平台）
  - job_name: 'experiment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8009']
        labels:
          service: 'experiment-service'

  # auth-service（Go + Fiber，/metrics 端点）
  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'auth-service'

  # user-service（Go + Fiber，/metrics 端点）
  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'user-service'
