apiVersion: 1

# 删除可能残留的旧数据源（OpenSearch 时代）
deleteDatasources:
  - name: OpenSearch-Traces
    orgId: 1
  - name: OpenSearch-Logs
    orgId: 1
  - name: Elasticsearch-Traces
    orgId: 1
  - name: Elasticsearch-Logs
    orgId: 1

datasources:
  # Metrics（Prometheus）：抓 OTel Collector :8889 的 OTLP→Prometheus 端点
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Traces → Elasticsearch（data stream，OTel otel 模式自动建）
  # uid 沿用 opensearch-traces 以兼容现有 dashboard 引用
  - name: Elasticsearch-Traces
    uid: opensearch-traces
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "traces-generic.otel-default"
    jsonData:
      esVersion: "8.0+"
      timeField: "@timestamp"
      xpack: false
    editable: true

  # Logs → Elasticsearch（data stream）
  - name: Elasticsearch-Logs
    uid: opensearch-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logs-generic.otel-default"
    jsonData:
      esVersion: "8.0+"
      timeField: "@timestamp"
      xpack: false
      logMessageField: "body.text"
      logLevelField: "severity_text"
    editable: true
