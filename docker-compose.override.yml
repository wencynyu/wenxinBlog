# =====================================================
# App 服务覆盖（本地开发）
# -----------------------------------------------------
# 此文件将 8 个应用服务 + web 加到 docker-compose。
# docker compose up 即可一键拉起全套（基建 + 应用 + 前端）。
# =====================================================

x-java-defaults: &java-defaults
  restart: unless-stopped
  networks:
    - wenxinblog

services:
  # =====================================================
  # 后端服务
  # =====================================================
  auth-service:
    <<: *java-defaults
    build: ./services/auth-service
    container_name: wenxinblog-app-auth
    ports:
      - "8001:8001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-auth:5432/auth_db?sslmode=disable
      REDIS_URL: redis://redis-cache:6379
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  user-service:
    <<: *java-defaults
    build: ./services/user-service
    container_name: wenxinblog-app-user
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-user:5432/user_db?sslmode=disable
      REDIS_URL: redis://redis-cache:6379
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      postgres-user:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  blog-service:
    <<: *java-defaults
    build: ./services/blog-service
    container_name: wenxinblog-app-blog
    ports:
      - "8003:8003"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      OPENSEARCH_URIS: http://opensearch:9200
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  search-service:
    <<: *java-defaults
    build: ./services/search-service
    container_name: wenxinblog-app-search
    ports:
      - "8005:8005"
    environment:
      OPENSEARCH_URIS: http://opensearch:9200
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      opensearch:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  recommendation-service:
    <<: *java-defaults
    build: ./services/recommendation-service
    container_name: wenxinblog-app-recommend
    ports:
      - "8006:8006"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MILVUS_HOST: milvus-standalone
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  content-service:
    <<: *java-defaults
    build: ./services/content-service
    container_name: wenxinblog-app-content
    ports:
      - "8004:8004"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      MINIO_ENDPOINT: http://minio-oss:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-oss:
        condition: service_healthy

  ad-service:
    <<: *java-defaults
    build: ./services/ad-service
    container_name: wenxinblog-app-ad
    ports:
      - "8007:8007"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  gateway:
    <<: *java-defaults
    build: ./services/gateway
    container_name: wenxinblog-app-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SPRING_DATA_REDIS_HOST: redis-cache
      # 服务在容器网络中用服务名通信（不用 localhost）
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      auth-service:
        condition: service_started
      blog-service:
        condition: service_started

  # =====================================================
  # 前端
  # =====================================================
  web:
    <<: *java-defaults
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: wenxinblog-app-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_OSS_URL: http://localhost:9000
    depends_on:
      gateway:
        condition: service_started
