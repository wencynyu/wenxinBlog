# =====================================================
# App 服务覆盖（本地开发）
# -----------------------------------------------------
# 此文件将 8 个应用服务 + web 加到 docker-compose。
# docker compose up 即可一键拉起全套（基建 + 应用 + 前端）。
# =====================================================

x-java-defaults: &java-defaults
  restart: unless-stopped
  networks:
    - wenxinblog
  # OTel 配置（infra/otel/otel.env）：Java agent / Go SDK 读取；web 忽略。
  # OTEL_SERVICE_NAME 由各服务自身 environment 指定。
  env_file:
    - ./infra/otel/otel.env

services:
  # =====================================================
  # 后端服务
  # =====================================================
  auth-service:
    <<: *java-defaults
    build: ./services/auth-service
    container_name: wenxinblog-app-auth
    ports:
      - "8001:8001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-auth:5432/auth_db?sslmode=disable
      REDIS_URL: redis://redis-cache:6379
      USER_SERVICE_URL: http://user-service:8002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # OAuth（留空则关闭对应登录方式）
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/callback/google}
      # 短信（手机号验证码）
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  user-service:
    <<: *java-defaults
    build: ./services/user-service
    container_name: wenxinblog-app-user
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-user:5432/user_db?sslmode=disable
      REDIS_URL: redis://redis-cache:6379
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      postgres-user:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  blog-service:
    <<: *java-defaults
    build: ./services/blog-service
    container_name: wenxinblog-app-blog
    ports:
      - "8003:8003"
    environment:
      OTEL_SERVICE_NAME: blog-service
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      OPENSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  search-service:
    <<: *java-defaults
    build: ./services/search-service
    container_name: wenxinblog-app-search
    ports:
      - "8005:8005"
    environment:
      OTEL_SERVICE_NAME: search-service
      OPENSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  recommendation-service:
    <<: *java-defaults
    build: ./services/recommendation-service
    container_name: wenxinblog-app-recommend
    ports:
      - "8006:8006"
    environment:
      OTEL_SERVICE_NAME: recommendation-service
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MILVUS_HOST: milvus-standalone
      EMBEDDING_URL: http://embedding-service:8008
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  experiment-service:
    <<: *java-defaults
    build: ./services/experiment-service
    container_name: wenxinblog-app-experiment
    ports:
      - "8009:8009"
    environment:
      OTEL_SERVICE_NAME: experiment-service
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-experiment:5432/experiment_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-experiment:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  analytics-service:
    <<: *java-defaults
    build: ./services/analytics-service
    container_name: wenxinblog-app-analytics
    ports:
      - "8010:8010"
    environment:
      OTEL_SERVICE_NAME: analytics-service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_URL: jdbc:ch://clickhouse:8123/default
    depends_on:
      clickhouse:
        condition: service_healthy


  # Embedding 服务（生产：vLLM on NVIDIA，OpenAI 兼容 /v1/embeddings）。
  # 本地开发不走 compose——由 scripts/start-dev.sh 原生 uvicorn 跑（MPS）。需要 GPU 时 `docker compose --profile gpu up`。
  embedding-service:
    <<: *java-defaults
    profiles: [gpu]
    image: vllm/vllm-openai:latest
    container_name: wenxinblog-app-embedding
    ports:
      - "8008:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      --model Qwen/Qwen3-VL-Embedding-2B
      --port 8000
      --trust-remote-code
      --max-model-len 8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  content-service:
    <<: *java-defaults
    build: ./services/content-service
    container_name: wenxinblog-app-content
    ports:
      - "8004:8004"
    environment:
      OTEL_SERVICE_NAME: content-service
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      MINIO_ENDPOINT: http://minio-oss:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio-oss:
        condition: service_healthy

  ad-service:
    <<: *java-defaults
    build: ./services/ad-service
    container_name: wenxinblog-app-ad
    ports:
      - "8007:8007"
    environment:
      OTEL_SERVICE_NAME: ad-service
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-blog:5432/blog_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-blog:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  gateway:
    <<: *java-defaults
    build: ./services/gateway
    container_name: wenxinblog-app-gateway
    ports:
      - "8080:8080"
    environment:
      OTEL_SERVICE_NAME: gateway
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      SPRING_DATA_REDIS_HOST: redis-cache
      # 服务在容器网络中用服务名通信（不用 localhost）
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      auth-service:
        condition: service_started
      blog-service:
        condition: service_started

  # =====================================================
  # 前端
  # =====================================================
  web:
    <<: *java-defaults
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: wenxinblog-app-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_OSS_URL: http://localhost:9000
    depends_on:
      gateway:
        condition: service_started
