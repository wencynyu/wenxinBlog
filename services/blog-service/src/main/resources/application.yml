server:
  port: 8003

spring:
  application:
    name: blog-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/blog_db
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5434/blog_db
    user: postgres
    password: ${POSTGRES_PASSWORD:postgres}
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis}

opensearch:
  uris: http://localhost:9200
  index:
    blog: wenxinblog-blog

# actuator + prometheus 指标（Grafana 采集）
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s
