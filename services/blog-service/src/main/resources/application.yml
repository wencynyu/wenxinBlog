server:
  port: 8003

spring:
  application:
    name: blog-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/blog_db
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis}

opensearch:
  uris: http://localhost:9200
  index:
    blog: wenxinblog-blog
