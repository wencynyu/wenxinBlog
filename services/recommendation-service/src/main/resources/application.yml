server:
  port: 8006

spring:
  application:
    name: recommendation-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/blog_db
    username: postgres
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:redis}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: recommendation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

milvus:
  host: localhost
  port: 19530
  nprobe: 16  # ANN 搜索参数：nprobe 越大召回越高、越慢

embedding:
  url: http://localhost:8008  # EmbeddingClient 用，对齐 EMBEDDING_URL env

recommendation:
  feed:
    page-size: 20
    cache-ttl-minutes: 10

# actuator：/health（start-dev 就绪探测 + 运维）、/metrics（micrometer 指标）
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
