server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # Spring Cloud 2025: server-webflux 变体的路由前缀为 server.webflux.routes
      server:
        webflux:
          # 路由配置（MVP 本地联调：直连各服务，不走注册中心）
          routes:
            # 认证服务 (公开)
            - id: auth-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0

            # 认证管理端点 (RBAC：AuthorizationFilter 按 /admin/users/*/ban 等映射 user:ban / user:assign_role)
            - id: auth-admin
              uri: http://localhost:8001
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 用户服务 (需认证)
            - id: user-service
              uri: http://localhost:8002
              predicates:
                - Path=/api/v1/users/**,/api/v1/me/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 博文服务
            - id: blog-service
              uri: http://localhost:8003
              predicates:
                - Path=/api/v1/posts/**,/api/v1/comments/**,/api/v1/tags/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 内容服务
            - id: content-service
              uri: http://localhost:8004
              predicates:
                - Path=/api/v1/content/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 搜索服务（/history 等需 X-User-Id，挂 AuthenticationFilter 注入）
            - id: search-service
              uri: http://localhost:8005
              predicates:
                - Path=/api/v1/search/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 推荐服务（GET 注入 X-User-Id 供个性化，POST/PUT/DELETE 强制鉴权）
            - id: recommendation-service
              uri: http://localhost:8006
              predicates:
                - Path=/api/v1/recommend/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 分析服务（事件 BI 查询；挂 AuthenticationFilter 使 X-User-Permissions 注入，AuthorizationFilter 校验 analytics:read）
            - id: analytics-service
              uri: http://localhost:8010
              predicates:
                - Path=/api/v1/analytics/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 广告服务（campaign 管理路由——此前缺失，经网关转发才能被鉴权）
            - id: ad-service
              uri: http://localhost:8007
              predicates:
                - Path=/api/v1/campaigns/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # A/B 实验服务（管理端点需鉴权，分配端点 GET 公开）
            - id: experiment-service
              uri: http://localhost:8009
              predicates:
                - Path=/api/v1/experiments/**,/api/v1/layers/**
              filters:
                - StripPrefix=0
                - name: AuthenticationFilter

            # 广告追踪 (公开)
            - id: ad-tracking
              uri: http://localhost:8007
              predicates:
                - Path=/api/v1/ads/t/**
              filters:
                - StripPrefix=0

            # 健康检查 (公开)
            - id: health
              uri: http://localhost:8001
              predicates:
                - Path=/health/**
              filters:
                - StripPrefix=0

          discovery:
            locator:
              enabled: false

          # 全局过滤器
          default-filters:
            # 全局剥离客户端可能伪造的身份头（下游只信任网关注入的 X-User-*）
            - RemoveRequestHeader=X-User-Id, X-User-Roles, X-User-Email, X-User-Permissions
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          # CORS 全局配置
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:3000
                  - https://wenxinblog.com
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

  # Redis 配置（默认密码 redis，对齐 docker-compose 的 redis-cache）
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:redis}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Kafka 配置（gateway 仅声明，Kafka 未启动时不影响路由）
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.JsonSerializer
      acks: 1
    consumer:
      group-id: gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  auth-service-url: http://localhost:8001

# 限流配置
rate-limit:
  default: 60
  burst: 10

# 熔断配置
resilience4j:
  circuitbreaker:
    instances:
      blog-service:
        sliding-window-size: 100
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 10
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      recommendation-service:
        sliding-window-size: 50
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        fallback-uri: forward:/api/v1/recommend/fallback

# 日志配置
logging:
  level:
    com.wenxinblog: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点（独立端口 8081，避免 Spring Cloud Gateway 路由管道拦截 actuator 请求）
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s
