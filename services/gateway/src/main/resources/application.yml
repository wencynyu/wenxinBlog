server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # 路由配置
      routes:
        # 认证服务 (公开)
        - id: auth-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # 用户服务 (需认证)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0
            - name: AuthenticationFilter

        # 博文服务 (需认证 + 限流)
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/api/v1/posts/**,/api/v1/comments/**,/api/v1/tags/**
          filters:
            - StripPrefix=0
            - name: AuthenticationFilter
            - name: RateLimitFilter
              args:
                limit: 20
                window: 60

        # 内容服务 (需认证 + 限流)
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/v1/content/**
          filters:
            - StripPrefix=0
            - name: AuthenticationFilter
            - name: RateLimitFilter
              args:
                limit: 10
                window: 60

        # 搜索服务 (限流)
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**
          filters:
            - StripPrefix=0
            - name: RateLimitFilter
              args:
                limit: 60
                window: 60

        # 推荐服务
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/v1/recommend/**
          filters:
            - StripPrefix=0

        # 广告服务 (内部)
        - id: ad-service-internal
          uri: lb://ad-service
          predicates:
            - Path=/internal/ads/**
            - name: InternalOnly
          filters:
            - StripPrefix=0

        # 广告追踪 (公开)
        - id: ad-tracking
          uri: lb://ad-service
          predicates:
            - Path=/api/v1/ads/t/**
          filters:
            - StripPrefix=0

        # 健康检查 (公开)
        - id: health
          uri: http://localhost:8001
          predicates:
            - Path=/health/**
          filters:
            - StripPrefix=0

      # 服务发现配置
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # 全局过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # CORS 全局配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - https://wenxinblog.com
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:redis}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Kafka 配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.JsonSerializer
      acks: 1
    consumer:
      group-id: gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.JsonDeserializer

# JWT 配置
jwt:
  secret: ${JWT_SECRET}
  auth-service-url: http://localhost:8001

# 限流配置
rate-limit:
  default: 60
  burst: 10

# 熔断配置
resilience4j:
  circuitbreaker:
    instances:
      blog-service:
        sliding-window-size: 100
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 10
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      recommendation-service:
        sliding-window-size: 50
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 5
        fallback-uri: forward:/api/v1/recommend/fallback

# 日志配置
logging:
  level:
    com.wenxinblog: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
